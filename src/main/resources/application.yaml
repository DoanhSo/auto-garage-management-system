spring:
  application:
    name: AutoGarage
  servlet:
    multipart:
      max-file-size: ${garage.workshop.max-attachment-bytes}B
      max-request-size: ${garage.workshop.max-upload-request-bytes}B
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

security:
  keycloak-admin:
    enabled: ${KEYCLOAK_ADMIN_ENABLED:true}
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:}
    realm: ${KEYCLOAK_ADMIN_REALM:}
    username: ${KEYCLOAK_ADMIN_USERNAME:}
    password: ${KEYCLOAK_ADMIN_PASSWORD:}
    connect-timeout: ${KEYCLOAK_ADMIN_CONNECT_TIMEOUT:5s}
    request-timeout: ${KEYCLOAK_ADMIN_REQUEST_TIMEOUT:10s}
  auth:
    issuer: ${KEYCLOAK_ISSUER_URI}
    audience: ${AUTH_JWT_AUDIENCE}
    jwk-set-uri: ${KEYCLOAK_JWKS_URI}
    clock-skew: ${AUTH_JWT_CLOCK_SKEW:0s}
    allowed-origins: ${AUTH_CORS_ORIGINS:}
    cors-max-age: ${AUTH_CORS_MAX_AGE:1h}
  browser-session:
    token-uri: ${KEYCLOAK_TOKEN_URI:${security.auth.issuer}/protocol/openid-connect/token}
    client-id: ${KEYCLOAK_BROWSER_CLIENT_ID:autogarage-frontend}
    request-timeout: ${AUTH_SESSION_REQUEST_TIMEOUT:10s}
    secure-cookie: ${AUTH_SESSION_COOKIE_SECURE:true}
  password:
    min-length: ${AUTH_PASSWORD_MIN_LENGTH:12}
  bootstrap:
    enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
    username: ${AUTH_BOOTSTRAP_USERNAME:}
    full-name: ${AUTH_BOOTSTRAP_FULL_NAME:}
    identity-id: ${AUTH_BOOTSTRAP_IDENTITY_ID:}

garage:
  workshop:
    default-service-minutes: ${WORKSHOP_DEFAULT_SERVICE_MINUTES:60}
    max-attachment-bytes: ${WORKSHOP_MAX_ATTACHMENT_BYTES:15728640}
    max-upload-request-bytes: ${WORKSHOP_MAX_UPLOAD_REQUEST_BYTES:16777216}
    reservation-hold: ${WORKSHOP_RESERVATION_HOLD:30m}
  pagination:
    default-size: ${PAGINATION_DEFAULT_SIZE:20}
    max-size: ${PAGINATION_MAX_SIZE:100}
    max-page: ${PAGINATION_MAX_PAGE:100000}
  report:
    max-period: ${REPORT_MAX_PERIOD:366d}
  notification:
    worker-enabled: ${NOTIFICATION_WORKER_ENABLED:false}
    reminders-enabled: ${NOTIFICATION_REMINDERS_ENABLED:false}
    batch-size: ${NOTIFICATION_BATCH_SIZE:20}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
    lease: ${NOTIFICATION_LEASE:2m}
    retry-delay: ${NOTIFICATION_RETRY_DELAY:5m}
    zone: ${GARAGE_TIME_ZONE:Asia/Bangkok}
    reminder-days: ${NOTIFICATION_REMINDER_DAYS:15}
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    email-from: ${NOTIFICATION_EMAIL_FROM:}
    sms-enabled: ${NOTIFICATION_SMS_ENABLED:false}
    sms-url: ${SMS_GATEWAY_URL:}
    sms-token: ${SMS_GATEWAY_TOKEN:}
    connect-timeout: ${NOTIFICATION_CONNECT_TIMEOUT:5s}
    request-timeout: ${NOTIFICATION_REQUEST_TIMEOUT:10s}
    poll-delay: ${NOTIFICATION_POLL_DELAY:5s}
    reminder-cron: ${NOTIFICATION_REMINDER_CRON:0 0 8 * * *}
    reminder-max-batches: ${NOTIFICATION_REMINDER_MAX_BATCHES:100}
    default-subject: ${NOTIFICATION_DEFAULT_SUBJECT:AutoGarage notification}
