spring:
  application:
    name: AutoGarage
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

security:
  auth:
    secret-base64: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_JWT_ISSUER}
    audience: ${AUTH_JWT_AUDIENCE}
    ttl: ${AUTH_JWT_TTL}
    clock-skew: ${AUTH_JWT_CLOCK_SKEW:0s}
    bcrypt-strength: ${AUTH_BCRYPT_STRENGTH:12}
    allowed-origins: ${AUTH_CORS_ORIGINS:}
    cors-max-age: ${AUTH_CORS_MAX_AGE:1h}
  password:
    min-length: ${AUTH_PASSWORD_MIN_LENGTH:12}
  bootstrap:
    enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
    username: ${AUTH_BOOTSTRAP_USERNAME:}
    full-name: ${AUTH_BOOTSTRAP_FULL_NAME:}
    password: ${AUTH_BOOTSTRAP_PASSWORD:}

garage:
  pagination:
    default-size: ${PAGINATION_DEFAULT_SIZE:20}
    max-size: ${PAGINATION_MAX_SIZE:100}
    max-page: ${PAGINATION_MAX_PAGE:100000}
  report:
    max-period: ${REPORT_MAX_PERIOD:366d}
  notification:
    worker-enabled: ${NOTIFICATION_WORKER_ENABLED:false}
    reminders-enabled: ${NOTIFICATION_REMINDERS_ENABLED:false}
    batch-size: ${NOTIFICATION_BATCH_SIZE:20}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
    lease: ${NOTIFICATION_LEASE:2m}
    retry-delay: ${NOTIFICATION_RETRY_DELAY:5m}
    zone: ${GARAGE_TIME_ZONE:Asia/Bangkok}
    reminder-days: ${NOTIFICATION_REMINDER_DAYS:15}
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    email-from: ${NOTIFICATION_EMAIL_FROM:}
    sms-enabled: ${NOTIFICATION_SMS_ENABLED:false}
    sms-url: ${SMS_GATEWAY_URL:}
    sms-token: ${SMS_GATEWAY_TOKEN:}
    connect-timeout: ${NOTIFICATION_CONNECT_TIMEOUT:5s}
    request-timeout: ${NOTIFICATION_REQUEST_TIMEOUT:10s}
    poll-delay: ${NOTIFICATION_POLL_DELAY:5s}
    reminder-cron: ${NOTIFICATION_REMINDER_CRON:0 0 8 * * *}
    reminder-max-batches: ${NOTIFICATION_REMINDER_MAX_BATCHES:100}
    default-subject: ${NOTIFICATION_DEFAULT_SUBJECT:AutoGarage notification}
