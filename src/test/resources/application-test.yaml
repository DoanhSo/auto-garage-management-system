spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3308/autogarage_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${TEST_DB_USERNAME:autogarage}
    password: ${TEST_DB_PASSWORD:autogarage_test}

security:
  auth:
    issuer: autogarage-test
    audience: autogarage-test-api
    ttl: 15m
    clock-skew: 0s
    bcrypt-strength: 4
    allowed-origins: http://localhost:5173
  bootstrap:
    enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

garage:
  notification:
    worker-enabled: false
    reminders-enabled: false
    email-enabled: false
    sms-enabled: false
