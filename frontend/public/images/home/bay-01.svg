<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="b1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="b1Lift" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="b1Floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="b1Car" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <pattern id="b1Stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#eab308" />
      <rect x="12" width="12" height="24" fill="#0f172a" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#b1Bg)" />

  <!-- Overhead LED hexagon lights -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.25">
    <polygon points="160,30 200,10 240,30 240,70 200,90 160,70" />
    <polygon points="240,30 280,10 320,30 320,70 280,90 240,70" />
    <polygon points="480,30 520,10 560,30 560,70 520,90 480,70" />
    <polygon points="560,30 600,10 640,30 640,70 600,90 560,70" />
  </g>

  <!-- Floor Perspective -->
  <polygon points="60,380 740,380 800,500 0,500" fill="url(#b1Floor)" opacity="0.8" />
  <!-- Safety Hazard Yellow/Black Border -->
  <polygon points="80,390 720,390 730,402 70,402" fill="url(#b1Stripes)" />
  <line x1="80" y1="402" x2="720" y2="402" stroke="#eab308" stroke-width="2" />

  <!-- Floor Grid -->
  <g stroke="#475569" stroke-width="1" opacity="0.4">
    <line x1="200" y1="390" x2="160" y2="500" />
    <line x1="320" y1="390" x2="300" y2="500" />
    <line x1="480" y1="390" x2="500" y2="500" />
    <line x1="600" y1="390" x2="640" y2="500" />
    <line x1="40" y1="440" x2="760" y2="440" />
  </g>

  <!-- Left Lift Post -->
  <rect x="180" y="80" width="36" height="340" rx="4" fill="url(#b1Lift)" stroke="#7f1d1d" stroke-width="1.5" />
  <rect x="170" y="410" width="56" height="18" rx="2" fill="#475569" stroke="#0f172a" stroke-width="1.5" />
  <!-- Lift Carriage Left -->
  <rect x="195" y="190" width="45" height="40" rx="3" fill="#991b1b" />
  <path d="M225,225 L340,245" stroke="#f87171" stroke-width="8" stroke-linecap="round" />

  <!-- Right Lift Post -->
  <rect x="584" y="80" width="36" height="340" rx="4" fill="url(#b1Lift)" stroke="#7f1d1d" stroke-width="1.5" />
  <rect x="574" y="410" width="56" height="18" rx="2" fill="#475569" stroke="#0f172a" stroke-width="1.5" />
  <!-- Lift Carriage Right -->
  <rect x="560" y="190" width="45" height="40" rx="3" fill="#991b1b" />
  <path d="M575,225 L460,245" stroke="#f87171" stroke-width="8" stroke-linecap="round" />

  <!-- Lift Overhead Crossbeam & Power Unit -->
  <rect x="190" y="85" width="420" height="12" fill="#b91c1c" />
  <rect x="156" y="220" width="22" height="60" rx="3" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
  <circle cx="167" cy="235" r="4" fill="#22c55e" />
  <circle cx="167" cy="250" r="4" fill="#ef4444" />

  <!-- Lifted Vehicle (Sedan Silhouette in elevated perspective) -->
  <g transform="translate(230, 160)">
    <!-- Chassis Shadow -->
    <ellipse cx="170" cy="95" rx="160" ry="14" fill="#090d16" opacity="0.6" />
    <!-- Car Body -->
    <path d="M10,75 C20,55 50,45 90,40 L140,20 C180,12 250,12 280,24 L315,48 C335,55 345,65 340,78 L330,86 L10,86 Z" fill="url(#b1Car)" stroke="#1d4ed8" stroke-width="1.5" />
    <!-- Glass Area -->
    <path d="M96,38 L142,21 C175,15 245,15 272,25 L300,45 Z" fill="#0f172a" opacity="0.85" />
    <path d="M102,37 L142,23 L200,23 L195,45 L102,45 Z" fill="#38bdf8" opacity="0.35" />
    <path d="M210,23 L270,25 L296,44 L205,45 Z" fill="#38bdf8" opacity="0.35" />
    <!-- Wheels -->
    <rect x="50" y="65" width="40" height="28" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <rect x="250" y="65" width="40" height="28" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <!-- Lift Pads Touching Points -->
    <rect x="85" y="86" width="30" height="8" rx="2" fill="#f59e0b" />
    <rect x="225" y="86" width="30" height="8" rx="2" fill="#f59e0b" />
  </g>

  <!-- Rolling Oil Drain Collector Underneath Car -->
  <g transform="translate(365, 270)">
    <polygon points="10,0 60,0 45,25 25,25" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
    <line x1="35" y1="25" x2="35" y2="90" stroke="#94a3b8" stroke-width="4" />
    <rect x="15" y="90" width="40" height="60" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <line x1="20" y1="105" x2="50" y2="105" stroke="#475569" stroke-width="1" />
    <line x1="20" y1="120" x2="50" y2="120" stroke="#475569" stroke-width="1" />
    <!-- Caster Wheels -->
    <circle cx="20" cy="154" r="5" fill="#0f172a" />
    <circle cx="50" cy="154" r="5" fill="#0f172a" />
  </g>

  <!-- Rolling Tool Chest (Left) -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="70" height="110" rx="4" fill="#b91c1c" stroke="#991b1b" stroke-width="2" />
    <!-- Drawers -->
    <rect x="6" y="8" width="58" height="14" rx="2" fill="#475569" />
    <rect x="6" y="26" width="58" height="14" rx="2" fill="#475569" />
    <rect x="6" y="44" width="58" height="14" rx="2" fill="#475569" />
    <rect x="6" y="62" width="58" height="18" rx="2" fill="#475569" />
    <rect x="6" y="84" width="58" height="18" rx="2" fill="#475569" />
    <!-- Drawer Handles -->
    <line x1="25" y1="15" x2="45" y2="15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="25" y1="33" x2="45" y2="33" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="25" y1="51" x2="45" y2="51" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Caster Wheels -->
    <circle cx="12" cy="114" r="5" fill="#0f172a" />
    <circle cx="58" cy="114" r="5" fill="#0f172a" />
  </g>

  <!-- Technical Information & Badges -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="220" height="32" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="18" cy="16" r="6" fill="#22c55e" />
    <text x="34" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      BAY-01 · BẢO DƯỠNG NHANH
    </text>
  </g>

  <!-- Bay Floor Marking -->
  <text x="400" y="475" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#334155" text-anchor="middle" letter-spacing="4">
    KHOANG 01 · 2-POST LIFT 4.0T
  </text>
</svg>
