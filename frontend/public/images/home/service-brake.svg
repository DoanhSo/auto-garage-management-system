<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rotorSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="caliperRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bBg)" />

  <rect x="50" y="40" width="160" height="34" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
  <text x="130" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fca5a5" text-anchor="middle" letter-spacing="1">
    HỆ THỐNG PHANH &amp; LỐP
  </text>

  <!-- Big Perforated Brake Rotor with Brembo Red Caliper & Michelin Tire -->
  <g transform="translate(180, 80)">
    <!-- Tire Outer Rim & Michelin Tread Pattern -->
    <g transform="translate(180, 140)">
      <circle cx="0" cy="0" r="140" fill="#0f172a" stroke="#292524" stroke-width="26" />
      <!-- Michelin Tire Tread Blocks -->
      <g stroke="#1c1917" stroke-width="3">
        <line x1="0" y1="-140" x2="0" y2="-125" />
        <line x1="99" y1="-99" x2="88" y2="-88" />
        <line x1="140" y1="0" x2="125" y2="0" />
        <line x1="99" y1="99" x2="88" y2="88" />
        <line x1="0" y1="140" x2="0" y2="125" />
        <line x1="-99" y1="99" x2="-88" y2="88" />
        <line x1="-140" y1="0" x2="-125" y2="0" />
        <line x1="-99" y1="-99" x2="-88" y2="-88" />
      </g>
    </g>

    <!-- Slotted & Cross-Drilled High Performance Brake Rotor -->
    <g transform="translate(180, 140)">
      <circle cx="0" cy="0" r="110" fill="url(#rotorSteel)" stroke="#cbd5e1" stroke-width="2" />
      <!-- Rotor Hub Center -->
      <circle cx="0" cy="0" r="50" fill="#334155" stroke="#1e293b" stroke-width="4" />
      <!-- 5 Wheel Lug Studs & Nuts -->
      <circle cx="0" cy="-30" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
      <circle cx="28" cy="-10" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
      <circle cx="18" cy="25" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
      <circle cx="-18" cy="25" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
      <circle cx="-28" cy="-10" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="2" />

      <!-- Cross-Drilled Holes Pattern (Lỗ tản nhiệt đĩa phanh) -->
      <g fill="#0f172a">
        <!-- Ring 1 -->
        <circle cx="0" cy="-75" r="3.5" /><circle cx="15" cy="-73" r="3.5" />
        <circle cx="53" cy="-53" r="3.5" /><circle cx="63" cy="-40" r="3.5" />
        <circle cx="75" cy="0" r="3.5" /><circle cx="73" cy="15" r="3.5" />
        <circle cx="53" cy="53" r="3.5" /><circle cx="40" cy="63" r="3.5" />
        <circle cx="0" cy="75" r="3.5" /><circle cx="-15" cy="73" r="3.5" />
        <circle cx="-53" cy="53" r="3.5" /><circle cx="-63" cy="40" r="3.5" />
        <circle cx="-75" cy="0" r="3.5" /><circle cx="-73" cy="-15" r="3.5" />
        <circle cx="-53" cy="-53" r="3.5" /><circle cx="-40" cy="-63" r="3.5" />
        
        <!-- Cooling Slots -->
        <path d="M-85,-20 C-65,-30 -40,-25 -25,-40" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <path d="M20,85 C30,65 25,40 40,25" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <path d="M-60,60 C-45,45 -50,20 -35,5" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
      </g>
    </g>

    <!-- Brembo 6-Piston Monobloc Red Brake Caliper -->
    <g transform="translate(230, 40)">
      <path d="M0,40 C20,10 70,0 110,10 C135,20 145,50 140,110 C135,140 110,170 80,180 L40,165 C60,140 65,100 55,65 Z" fill="url(#caliperRed)" stroke="#f87171" stroke-width="2.5" />
      <!-- Brembo Logo Text in White -->
      <text x="75" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" font-style="italic" letter-spacing="1" transform="rotate(65, 75, 105)">
        brembo
      </text>
      <!-- Bleeder Screw -->
      <rect x="30" y="20" width="8" height="15" fill="#facc15" stroke="#ca8a04" />
    </g>
  </g>

  <text x="400" y="445" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">
    BẢO DƯỠNG HỆ THỐNG PHANH &amp; THAY LỐP CHÍNH HÃNG
  </text>
  <text x="400" y="470" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Láng đĩa phanh tự động · Má phanh gốm Brembo Ceramic · Lốp Michelin chính hãng
  </text>
</svg>
