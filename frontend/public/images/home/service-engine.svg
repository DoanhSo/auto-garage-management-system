<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pistonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#eBg)" />

  <rect x="50" y="40" width="160" height="34" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="130" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">
    ĐẠI TU MÁY GẦM HỘP SỐ
  </text>

  <!-- Mechanical Engine Cross Section Components -->
  <g transform="translate(180, 80)">
    <!-- Crankshaft & Connecting Rods System -->
    <!-- Large Gear Assembly Left -->
    <g transform="translate(60, 200)">
      <circle cx="50" cy="50" r="60" fill="#334155" stroke="#64748b" stroke-width="4" />
      <!-- Gear teeth -->
      <path d="M50,-15 L50,115 M-15,50 L115,50 M5,5 L95,95 M5,95 L95,5" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
      <circle cx="50" cy="50" r="45" fill="#1e293b" />
      <circle cx="50" cy="50" r="20" fill="#64748b" stroke="#f8fafc" stroke-width="3" />
    </g>

    <!-- Meshed Smaller Gear -->
    <g transform="translate(160, 160)">
      <circle cx="40" cy="40" r="45" fill="#334155" stroke="#f59e0b" stroke-width="4" />
      <path d="M40,-5 L40,85 M-5,40 L85,40 M8,8 L72,72 M8,72 L72,8" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
      <circle cx="40" cy="40" r="30" fill="#0f172a" />
      <circle cx="40" cy="40" r="14" fill="#64748b" />
    </g>

    <!-- Piston 1 (Up stroke) -->
    <g transform="translate(120, 20)">
      <!-- Cylinder Chamber -->
      <rect x="-10" y="0" width="100" height="150" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4,4" />
      <!-- Piston Crown -->
      <rect x="0" y="10" width="80" height="60" rx="4" fill="url(#pistonGrad)" stroke="#e2e8f0" stroke-width="2" />
      <!-- Piston Rings -->
      <line x1="0" y1="20" x2="80" y2="20" stroke="#0f172a" stroke-width="2" />
      <line x1="0" y1="28" x2="80" y2="28" stroke="#0f172a" stroke-width="2" />
      <line x1="0" y1="36" x2="80" y2="36" stroke="#0f172a" stroke-width="2" />
      <!-- Connecting Rod -->
      <path d="M35,60 L32,150 L48,150 L45,60 Z" fill="#94a3b8" stroke="#475569" stroke-width="2" />
      <circle cx="40" cy="150" r="14" fill="#334155" stroke="#cbd5e1" stroke-width="3" />
    </g>

    <!-- Piston 2 (Down stroke) -->
    <g transform="translate(260, 20)">
      <!-- Cylinder Chamber -->
      <rect x="-10" y="0" width="100" height="150" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4,4" />
      <!-- Piston Crown -->
      <rect x="0" y="70" width="80" height="60" rx="4" fill="url(#pistonGrad)" stroke="#e2e8f0" stroke-width="2" />
      <line x1="0" y1="80" x2="80" y2="80" stroke="#0f172a" stroke-width="2" />
      <line x1="0" y1="88" x2="80" y2="88" stroke="#0f172a" stroke-width="2" />
      <!-- Connecting Rod -->
      <path d="M35,120 L32,210 L48,210 L45,120 Z" fill="#94a3b8" stroke="#475569" stroke-width="2" />
      <circle cx="40" cy="210" r="14" fill="#334155" stroke="#cbd5e1" stroke-width="3" />
    </g>

    <!-- Spark Plug Spark -->
    <g transform="translate(150, -10)">
      <rect x="5" y="0" width="10" height="25" fill="#f8fafc" stroke="#475569" />
      <path d="M10,25 L5,35 L12,32 L8,42" stroke="#38bdf8" stroke-width="2.5" fill="none" />
    </g>

    <!-- Micrometer Precision Measurement Tool -->
    <g transform="translate(260, 180) rotate(15)">
      <path d="M0,0 C-30,40 -30,80 0,120 L40,120 L40,105 L0,105 C-20,75 -20,45 0,15 L40,15 L40,0 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <rect x="35" y="10" width="90" height="20" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
      <rect x="110" y="5" width="45" height="30" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
      <text x="132" y="24" font-family="monospace" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">0.01mm</text>
    </g>
  </g>

  <text x="400" y="445" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">
    ĐẠI TU ĐỘNG CƠ &amp; HỘP SỐ CHUYÊN SÂU
  </text>
  <text x="400" y="470" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Gia công cơ khí chính xác · Phớt trục cơ, bạc biên, xéc-măng · Bảo hành 24 tháng
  </text>
</svg>
