<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="b5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="b5Tire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="b5Stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#eab308" />
      <rect x="12" width="12" height="24" fill="#0f172a" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#b5Bg)" />

  <!-- Floor Perspective -->
  <polygon points="50,370 750,370 800,500 0,500" fill="#1e293b" opacity="0.9" />
  <polygon points="70,380 730,380 740,392 60,392" fill="url(#b5Stripes)" />
  <line x1="70" y1="392" x2="730" y2="392" stroke="#eab308" stroke-width="2" />

  <!-- Heavy Duty Tire Changer Machine (Left) -->
  <g transform="translate(100, 160)">
    <!-- Base Cabinet -->
    <rect x="40" y="90" width="110" height="140" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
    <!-- Turntable Plate -->
    <ellipse cx="95" cy="85" rx="50" ry="18" fill="#475569" stroke="#94a3b8" stroke-width="2" />
    <!-- 4 Clamping Jaws -->
    <rect x="75" y="75" width="40" height="10" fill="#cbd5e1" />
    <rect x="90" y="65" width="10" height="30" fill="#cbd5e1" />
    <!-- Vertical Column & Tilting Arm -->
    <rect x="135" y="10" width="22" height="150" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Horizontal Arm & Demount Head -->
    <rect x="60" y="15" width="90" height="16" rx="2" fill="#0f172a" />
    <line x1="75" y1="25" x2="75" y2="75" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <polygon points="70,75 80,75 75,85" fill="#f59e0b" />
    <!-- Foot Pedals -->
    <rect x="50" y="225" width="20" height="8" rx="2" fill="#475569" />
    <rect x="75" y="225" width="20" height="8" rx="2" fill="#475569" />
    <rect x="100" y="225" width="20" height="8" rx="2" fill="#475569" />
  </g>

  <!-- Large Wheel & Brembo Brake Caliper Assembly (Center) -->
  <g transform="translate(320, 150)">
    <!-- Slotted Brake Rotor -->
    <circle cx="90" cy="90" r="75" fill="#64748b" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="90" cy="90" r="45" fill="#475569" stroke="#334155" stroke-width="2" />
    <!-- Slots on Rotor -->
    <line x1="90" y1="25" x2="105" y2="40" stroke="#334155" stroke-width="2" />
    <line x1="155" y1="90" x2="140" y2="105" stroke="#334155" stroke-width="2" />
    <line x1="90" y1="155" x2="75" y2="140" stroke="#334155" stroke-width="2" />
    <line x1="25" y1="90" x2="40" y2="75" stroke="#334155" stroke-width="2" />
    <!-- 5 Wheel Lug Studs -->
    <circle cx="90" cy="65" r="4" fill="#cbd5e1" />
    <circle cx="114" cy="82" r="4" fill="#cbd5e1" />
    <circle cx="105" cy="110" r="4" fill="#cbd5e1" />
    <circle cx="75" cy="110" r="4" fill="#cbd5e1" />
    <circle cx="66" cy="82" r="4" fill="#cbd5e1" />

    <!-- Red Brembo Style Caliper -->
    <path d="M110,25 C145,35 165,65 170,100 L145,100 C140,75 125,50 100,45 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <text x="135" y="70" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#ffffff" transform="rotate(35 135 70)">BREMBO</text>

    <!-- Pneumatic Impact Wrench lying on floor -->
    <g transform="translate(20, 185) rotate(-10)">
      <rect x="0" y="0" width="35" height="20" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
      <rect x="25" y="5" width="25" height="10" rx="2" fill="#cbd5e1" />
      <rect x="8" y="20" width="12" height="30" rx="2" fill="#dc2626" />
      <!-- Air hose coil -->
      <path d="M14,50 Q18,65 10,75 T16,90" fill="none" stroke="#f59e0b" stroke-width="3" />
    </g>
  </g>

  <!-- Digital Laser Wheel Balancer Machine (Right) -->
  <g transform="translate(560, 160)">
    <!-- Base Cabinet -->
    <rect x="20" y="70" width="120" height="160" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Balancer Spindle with Mounted Tire -->
    <ellipse cx="20" cy="120" rx="16" ry="50" fill="url(#b5Tire)" stroke="#64748b" stroke-width="3" />
    <ellipse cx="20" cy="120" rx="10" ry="30" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
    <!-- Protective Hood Arc -->
    <path d="M-5,70 C-5,35 45,30 50,70" fill="none" stroke="#0f172a" stroke-width="5" />
    <!-- Digital LCD Touch Display -->
    <rect x="65" y="10" width="80" height="55" rx="4" fill="#090d16" stroke="#38bdf8" stroke-width="2" />
    <text x="105" y="26" font-family="monospace" font-size="9" font-weight="900" fill="#38bdf8" text-anchor="middle">LASER BALANCE</text>
    <rect x="72" y="32" width="30" height="18" rx="2" fill="#14532d" />
    <text x="87" y="45" font-family="monospace" font-size="10" font-weight="900" fill="#4ade80" text-anchor="middle">10g</text>
    <rect x="108" y="32" width="30" height="18" rx="2" fill="#14532d" />
    <text x="123" y="45" font-family="monospace" font-size="10" font-weight="900" fill="#4ade80" text-anchor="middle">15g</text>
    <!-- Brand / Tech Label -->
    <text x="80" y="95" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#94a3b8">MICHELIN · OEM</text>
  </g>

  <!-- Bay Header Badge -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="220" height="32" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="18" cy="16" r="6" fill="#ef4444" />
    <text x="34" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      BAY-05 · PHANH & LỐP 3D
    </text>
  </g>

  <!-- Bay Floor Marking -->
  <text x="400" y="475" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#334155" text-anchor="middle" letter-spacing="4">
    KHOANG 05 · BRAKE & TIRE CENTER
  </text>
</svg>
