<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="b2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="b2Lift" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="b2Hunter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <pattern id="b2Stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#eab308" />
      <rect x="12" width="12" height="24" fill="#0f172a" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#b2Bg)" />

  <!-- Floor Perspective -->
  <polygon points="50,370 750,370 800,500 0,500" fill="#1e293b" opacity="0.9" />
  <polygon points="70,380 730,380 740,392 60,392" fill="url(#b2Stripes)" />
  <line x1="70" y1="392" x2="730" y2="392" stroke="#eab308" stroke-width="2" />

  <!-- 4-Post Lift Runways -->
  <!-- 4 vertical posts -->
  <rect x="130" y="160" width="22" height="230" rx="3" fill="#64748b" />
  <rect x="230" y="140" width="18" height="220" rx="3" fill="#475569" />
  <rect x="560" y="140" width="18" height="220" rx="3" fill="#475569" />
  <rect x="660" y="160" width="22" height="230" rx="3" fill="#64748b" />

  <!-- Left and Right Runways -->
  <polygon points="120,290 240,260 270,260 160,300" fill="url(#b2Lift)" stroke="#334155" stroke-width="2" />
  <polygon points="540,260 660,290 640,300 520,260" fill="url(#b2Lift)" stroke="#334155" stroke-width="2" />

  <!-- Car on Lift (Rear-Quarter perspective facing Hunter cameras) -->
  <g transform="translate(240, 150)">
    <!-- Body -->
    <path d="M40,110 C50,85 80,70 140,65 L200,65 C260,70 290,85 300,110 L310,135 L30,135 Z" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <path d="M80,68 L120,35 L220,35 L260,68 Z" fill="#0f172a" opacity="0.9" />
    <!-- Rear windshield reflection -->
    <polygon points="125,38 215,38 250,65 90,65" fill="#38bdf8" opacity="0.25" />
    <!-- Rear Taillights Red Bar -->
    <rect x="55" y="105" width="230" height="8" rx="4" fill="#ef4444" />
    <!-- License Plate Area -->
    <rect x="135" y="118" width="70" height="15" rx="2" fill="#ffffff" />
    <text x="170" y="129" font-family="monospace" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">30H-888.68</text>

    <!-- Wheels with 3D Hunter Targets -->
    <!-- Left Wheel Target -->
    <g transform="translate(20, 100)">
      <circle cx="20" cy="25" r="22" fill="#0f172a" stroke="#475569" stroke-width="3" />
      <polygon points="20,8 35,25 20,42 5,25" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5" />
      <rect x="14" y="19" width="12" height="12" fill="#0f172a" />
      <circle cx="20" cy="25" r="3" fill="#ef4444" />
    </g>
    <!-- Right Wheel Target -->
    <g transform="translate(280, 100)">
      <circle cx="20" cy="25" r="22" fill="#0f172a" stroke="#475569" stroke-width="3" />
      <polygon points="20,8 35,25 20,42 5,25" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5" />
      <rect x="14" y="19" width="12" height="12" fill="#0f172a" />
      <circle cx="20" cy="25" r="3" fill="#ef4444" />
    </g>
  </g>

  <!-- Hunter Hawkeye Elite Camera Tower (Front-Center / Elevated) -->
  <g transform="translate(350, 40)">
    <!-- Main Center Post -->
    <rect x="42" y="30" width="16" height="160" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" />
    <rect x="30" y="180" width="40" height="15" rx="3" fill="#1e293b" />
    <!-- Horizontal Crossbar with 4 High-Res 3D Optical Cameras -->
    <rect x="-100" y="40" width="300" height="16" rx="4" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />
    <!-- Brand Label -->
    <rect x="15" y="22" width="70" height="16" rx="2" fill="#991b1b" />
    <text x="50" y="34" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">HUNTER</text>
    <!-- 4 Cameras with optical lenses -->
    <circle cx="-80" cy="48" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="-80" cy="48" r="4" fill="#38bdf8" />
    <circle cx="-20" cy="48" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="-20" cy="48" r="4" fill="#38bdf8" />
    <circle cx="120" cy="48" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="120" cy="48" r="4" fill="#38bdf8" />
    <circle cx="180" cy="48" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="180" cy="48" r="4" fill="#38bdf8" />
    <!-- Digital Target Laser Rays -->
    <line x1="-80" y1="58" x2="-80" y2="190" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <line x1="180" y1="58" x2="180" y2="190" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
  </g>

  <!-- Alignment Monitor Console (Right side) -->
  <g transform="translate(620, 240)">
    <rect x="0" y="0" width="130" height="95" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <!-- Stand -->
    <rect x="58" y="95" width="14" height="45" fill="#475569" />
    <rect x="40" y="140" width="50" height="10" rx="2" fill="#334155" />
    <!-- Screen Dials / Toe Camber Readings -->
    <text x="65" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#38bdf8" text-anchor="middle">HAWKEYE 3D</text>
    <rect x="12" y="28" width="48" height="24" rx="3" fill="#14532d" />
    <text x="36" y="42" font-family="monospace" font-size="10" font-weight="900" fill="#4ade80" text-anchor="middle">+0°02'</text>
    <rect x="70" y="28" width="48" height="24" rx="3" fill="#14532d" />
    <text x="94" y="42" font-family="monospace" font-size="10" font-weight="900" fill="#4ade80" text-anchor="middle">-0°45'</text>
    <rect x="25" y="62" width="80" height="20" rx="3" fill="#1e293b" />
    <text x="65" y="75" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">✓ ALIGNED (PASS)</text>
  </g>

  <!-- Bay Header Badge -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="220" height="32" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="18" cy="16" r="6" fill="#38bdf8" />
    <text x="34" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      BAY-02 · CÂN CHỈNH 3D
    </text>
  </g>

  <!-- Bay Floor Marking -->
  <text x="400" y="475" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#334155" text-anchor="middle" letter-spacing="4">
    KHOANG 02 · HUNTER HAWKEYE ELITE
  </text>
</svg>
