<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02131e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#021b1a" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dBg)" />

  <rect x="50" y="40" width="170" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="135" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">
    CHẨN ĐOÁN OBD-II &amp; AC
  </text>

  <!-- Diagnostic Tablet Computer & Oscilloscope -->
  <g transform="translate(140, 90)">
    <!-- Rugged Tablet Body -->
    <rect x="0" y="0" width="340" height="230" rx="14" fill="#1e293b" stroke="#334155" stroke-width="8" />
    <!-- Bumper Corners -->
    <rect x="-6" y="-6" width="24" height="24" rx="6" fill="#0284c7" />
    <rect x="322" y="-6" width="24" height="24" rx="6" fill="#0284c7" />
    <rect x="-6" y="212" width="24" height="24" rx="6" fill="#0284c7" />
    <rect x="322" y="212" width="24" height="24" rx="6" fill="#0284c7" />

    <!-- Screen Area -->
    <rect x="20" y="20" width="300" height="190" rx="6" fill="url(#screenGrad)" stroke="#0d9488" stroke-width="2" />

    <!-- OBD Diagnostic Live Stream -->
    <g transform="translate(35, 35)">
      <!-- Top Status Header -->
      <text x="0" y="14" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">
        ECU ONLINE: TOYOTA/LEXUS CAN BUS
      </text>
      <circle cx="250" cy="10" r="5" fill="#22c55e" />

      <!-- Fault Code Display -->
      <rect x="0" y="28" width="255" height="42" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
      <text x="12" y="46" font-family="monospace" font-size="12" font-weight="900" fill="#ef4444">
        DTC: P0302 (CYLINDER 2 MISFIRE)
      </text>
      <text x="12" y="62" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8">
        Tình trạng: Hiện thời · Đèn Check Engine Sáng
      </text>

      <!-- Waveform Graph (Oscilloscope) -->
      <rect x="0" y="80" width="255" height="60" rx="4" fill="#021414" stroke="#047857" stroke-width="1" />
      <!-- Grid lines -->
      <line x1="0" y1="100" x2="255" y2="100" stroke="#065f46" stroke-width="0.8" stroke-dasharray="2,3" />
      <line x1="0" y1="120" x2="255" y2="120" stroke="#065f46" stroke-width="0.8" stroke-dasharray="2,3" />
      <!-- Sine/Square Signal Waves -->
      <path d="M5,125 L30,125 L35,88 L55,88 L60,125 L100,125 L105,88 L125,88 L130,125 L170,125 L175,98 L185,125 L210,125 L215,88 L235,88 L240,125" fill="none" stroke="#10b981" stroke-width="2" />
    </g>

    <!-- Heavy Duty Diagnostic Cable & OBD-II 16-Pin Connector -->
    <path d="M340,115 C410,115 420,180 470,180" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
    <path d="M340,115 C410,115 420,180 470,180" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" />

    <!-- 16-pin OBD2 Plug -->
    <g transform="translate(450, 150)">
      <polygon points="10,0 60,0 70,30 0,30" fill="#334155" stroke="#94a3b8" stroke-width="2" />
      <!-- Pins -->
      <rect x="12" y="8" width="6" height="6" fill="#facc15" />
      <rect x="24" y="8" width="6" height="6" fill="#facc15" />
      <rect x="36" y="8" width="6" height="6" fill="#facc15" />
      <rect x="48" y="8" width="6" height="6" fill="#facc15" />
      <rect x="15" y="18" width="6" height="6" fill="#facc15" />
      <rect x="27" y="18" width="6" height="6" fill="#facc15" />
      <rect x="39" y="18" width="6" height="6" fill="#facc15" />
      <rect x="51" y="18" width="6" height="6" fill="#facc15" />
    </g>

    <!-- Air Conditioning Manifold Gauge Set (Đồng hồ nạp gas lạnh) -->
    <g transform="translate(360, 10)">
      <!-- Blue Low Pressure Gauge -->
      <circle cx="35" cy="35" r="32" fill="#0f172a" stroke="#0284c7" stroke-width="3" />
      <text x="35" y="24" font-family="sans-serif" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">LOW (PSI)</text>
      <line x1="35" y1="35" x2="48" y2="24" stroke="#38bdf8" stroke-width="2.5" />
      
      <!-- Red High Pressure Gauge -->
      <circle cx="105" cy="35" r="32" fill="#0f172a" stroke="#ef4444" stroke-width="3" />
      <text x="105" y="24" font-family="sans-serif" font-size="8" font-weight="700" fill="#f87171" text-anchor="middle">HIGH (PSI)</text>
      <line x1="105" y1="35" x2="118" y2="24" stroke="#ef4444" stroke-width="2.5" />

      <!-- Center Brass Block & Knobs -->
      <rect x="25" y="68" width="90" height="20" rx="3" fill="#b45309" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="35" cy="78" r="8" fill="#0284c7" />
      <circle cx="105" cy="78" r="8" fill="#ef4444" />
    </g>
  </g>

  <text x="400" y="445" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">
    CHẨN ĐOÁN ĐIỆN TỬ OBD-II &amp; ĐIỀU HÒA CHUYÊN SÂU
  </text>
  <text x="400" y="470" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Quét mã lỗi ECU · Nội soi khử khuẩn dàn lạnh · Nạp gas lạnh R134a tự động
  </text>
</svg>
