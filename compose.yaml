services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: autogarage
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in your environment or .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment or .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql-test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_DATABASE: autogarage_test
      MYSQL_USER: autogarage
      MYSQL_PASSWORD: autogarage_test
      MYSQL_ROOT_PASSWORD: test_root
      TZ: UTC
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql_data:
