services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: autogarage
      MYSQL_USER: ${DB_USERNAME:?Generate Docker configuration with scripts/start-docker.ps1}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}
      TZ: UTC
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Missing KEYCLOAK_DB_PASSWORD}
      TZ: UTC
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: [start-dev, --import-realm]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Missing KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Missing KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8081}
      AUTOGARAGE_FRONTEND_URL: http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-3000}
      TZ: UTC
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8081}:8080'
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./docker/keycloak/healthcheck.sh:/opt/autogarage/healthcheck.sh:ro
    healthcheck:
      test: [CMD, bash, /opt/autogarage/healthcheck.sh]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.0
    user: '0:0'
    entrypoint: [bash, /opt/autogarage/setup.sh]
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Missing KEYCLOAK_ADMIN_PASSWORD}
      GARAGE_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-garage.admin}
      GARAGE_ADMIN_PASSWORD: ${GARAGE_ADMIN_PASSWORD:-}
      FRONTEND_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-3000}
    volumes:
      - ./docker/keycloak/setup.sh:/opt/autogarage/setup.sh:ro
      - ./docker/keycloak/user-profile.json:/opt/autogarage/user-profile.json:ro
      - ./docker/keycloak/auth-version-mapper.json:/opt/autogarage/auth-version-mapper.json:ro
      - bootstrap_data:/run/autogarage
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: autogarage-backend:${AUTOGARAGE_IMAGE_TAG:-local}
    depends_on:
      mysql:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:mysql://mysql:3306/autogarage?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: ${DB_USERNAME:?Missing DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8081}/realms/autogarage-realm
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/autogarage-realm/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_ENABLED: 'true'
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: autogarage-realm
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Missing KEYCLOAK_ADMIN_PASSWORD}
      AUTH_JWT_AUDIENCE: autogarage-api
      AUTH_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      OPENAPI_ENABLED: 'true'
      AUTH_BOOTSTRAP_ENABLED: ${AUTH_BOOTSTRAP_ENABLED:-false}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-}
      AUTH_BOOTSTRAP_FULL_NAME: ${AUTH_BOOTSTRAP_FULL_NAME:-}
      AUTH_BOOTSTRAP_IDENTITY_ID: ${AUTH_BOOTSTRAP_IDENTITY_ID:-}
      NOTIFICATION_WORKER_ENABLED: 'false'
      NOTIFICATION_REMINDERS_ENABLED: 'false'
      NOTIFICATION_EMAIL_ENABLED: 'false'
      NOTIFICATION_SMS_ENABLED: 'false'
      SERVER_PORT: '8080'
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    volumes:
      - bootstrap_data:/run/autogarage:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: autogarage-frontend:${AUTOGARAGE_IMAGE_TAG:-local}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      KEYCLOAK_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8081}/realms/autogarage-realm
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:80'

  mysql-test:
    image: mysql:8.4
    profiles: [test]
    environment:
      MYSQL_DATABASE: autogarage_test
      MYSQL_USER: autogarage
      MYSQL_PASSWORD: autogarage_test
      MYSQL_ROOT_PASSWORD: test_root
      TZ: UTC
    ports:
      - '127.0.0.1:3308:3306'
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql_data:
  keycloak_postgres_data:
  bootstrap_data:
